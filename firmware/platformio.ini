[platformio]
default_envs = car

[env:car]
platform       = espressif8266
board          = esp12e
framework      = arduino
monitor_speed  = 115200
monitor_port   = COM4
build_src_filter = +<CarUnit/**>
build_flags =
    -DUSE_I2CDEVLIB
lib_deps =
    I2Cdevlib-MPU6050 @ ^1.0.5
    adafruit/Adafruit VL53L1X@^3.1.2
; Set Car explicitly if you program it from the PC; otherwise omit if Car is on a charger
upload_port    = COM4
upload_speed   = 115200

[env:start]
platform       = espressif8266
board          = esp12e
framework      = arduino
monitor_speed  = 115200
monitor_port   = COM8
build_src_filter = +<StartUnit/**>
lib_deps =
    https://github.com/adafruit/Adafruit_VL53L1X.git#main
    pololu/VL53L1X@^1.3.1
    jrowberg/I2Cdevlib-Core@^1.0.1
    jrowberg/I2Cdevlib-MPU6050@^1.0.0
    adafruit/Adafruit VL53L1X@^3.1.2
; upload_port omitted -> auto-detect
upload_port    = COM8
upload_speed   = 115200

[env:finish]
platform       = espressif8266
board          = esp12e
framework      = arduino
monitor_speed  = 115200
monitor_port   = COM7
build_src_filter = +<FinishUnit/**>
lib_deps =
    https://github.com/adafruit/Adafruit_VL53L1X.git#main
    pololu/VL53L1X@^1.3.1
    jrowberg/I2Cdevlib-Core@^1.0.1
    jrowberg/I2Cdevlib-MPU6050@^1.0.0
    adafruit/Adafruit VL53L1X@^3.1.2
; upload_port omitted -> auto-detect
upload_port    = COM7
upload_speed   = 115200
